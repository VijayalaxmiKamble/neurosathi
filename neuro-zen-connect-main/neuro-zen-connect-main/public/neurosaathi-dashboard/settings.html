<!DOCTYPE html>
<html lang="en" data-text-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — NeuroSaathi</title>
<meta name="description" content="Language, accessibility, notifications, profile and data controls.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content" id="main" tabindex="-1">
      <div class="grid grid-2">
        <div class="card" id="profile" tabindex="-1"><h2>Profile</h2><div id="profile-form"></div></div>
        <div class="card"><h2>Accessibility</h2><div id="a11y-form"></div></div>
        <div class="card"><h2>Notifications & voice</h2><div id="notif-form"></div></div>
        <div class="card"><h2>Data & privacy</h2><div id="data-form"></div></div>
      </div>
      <p class="disclaimer">NeuroSaathi supports daily routine, memory practice and caregiver coordination. It does not diagnose, treat or make any medical claim. Always follow your doctor's advice.</p>
    </main>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ai-engine.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/settings.js"></script>
<script>
  NS.auth.requireAuth("patient");
  NS.buildShell({ role: "patient", title: "Settings", subtitle: "Language, accessibility and data" });
  if (window.PAGE_INIT) window.PAGE_INIT();
</script>
</body>
</html>
