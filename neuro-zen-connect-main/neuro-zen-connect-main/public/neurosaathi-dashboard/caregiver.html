<!DOCTYPE html>
<html lang="en" data-text-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caregiver Dashboard — NeuroSaathi</title>
<meta name="description" content="Monitor patients, alerts and engagement from one caregiver dashboard.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content" id="main" tabindex="-1">
      <div class="grid grid-4" id="care-stats" style="margin-bottom:18px"></div>
      <div class="grid grid-2" style="margin-bottom:18px">
        <div class="card"><div class="card-head"><h2>Patients</h2><a class="btn btn-sm btn-secondary" href="patients.html">Manage</a></div>
          <div class="list" id="care-patients"></div></div>
        <div class="card"><div class="card-head"><h2>Recent alerts</h2><a class="btn btn-sm btn-secondary" href="alerts.html">All alerts</a></div>
          <div class="list" id="care-alerts"></div></div>
      </div>
      <div class="grid grid-2">
        <div class="insight" id="care-insight"></div>
        <div class="card"><h2>Today's reminder status</h2><div class="list" id="care-reminders"></div></div>
      </div>
      <p class="disclaimer">NeuroSaathi supports daily routine, memory practice and caregiver coordination. It does not diagnose, treat or make any medical claim. Always follow your doctor's advice.</p>
    </main>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ai-engine.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/caregiver.js"></script>
<script>
  NS.auth.requireAuth("caregiver");
  NS.buildShell({ role: "caregiver", title: "Caregiver Dashboard", subtitle: "Overview of everyone in your care" });
  if (window.PAGE_INIT) window.PAGE_INIT();
</script>
</body>
</html>
