<!DOCTYPE html>
<html lang="en" data-text-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Routine — NeuroSaathi</title>
<meta name="description" content="Visual daily routine timeline with completion tracking.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content" id="main" tabindex="-1">
      <div class="card" style="margin-bottom:18px"><div class="card-head"><h2>Today</h2>
        <div class="row" style="flex:0"><button class="btn btn-sm" id="add-activity">➕ Add activity</button>
        <button class="btn btn-sm btn-outline" id="reset-day">Reset day</button></div></div>
        <div class="metric-row"><span>Routine completion</span><span id="routine-pct">0%</span></div>
        <div class="bar teal"><span id="routine-bar" style="width:0%"></span></div></div>
      <div class="timeline" id="routine-full"></div>
      <p class="disclaimer">NeuroSaathi supports daily routine, memory practice and caregiver coordination. It does not diagnose, treat or make any medical claim. Always follow your doctor's advice.</p>
    </main>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ai-engine.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/routine.js"></script>
<script>
  NS.auth.requireAuth("patient");
  NS.buildShell({ role: "patient", title: "Daily Routine", subtitle: "A calm, predictable day" });
  if (window.PAGE_INIT) window.PAGE_INIT();
</script>
</body>
</html>
