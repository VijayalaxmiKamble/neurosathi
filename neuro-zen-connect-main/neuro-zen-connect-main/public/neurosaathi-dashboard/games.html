<!DOCTYPE html>
<html lang="en" data-text-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognitive Games — NeuroSaathi</title>
<meta name="description" content="Four adaptive memory and attention games for elderly users.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content" id="main" tabindex="-1">
      <div class="card lav" id="recommendation" style="margin-bottom:18px"></div>
      <div class="grid grid-2" id="game-list"></div>
      <div class="card" style="margin-top:18px"><h2>Recent sessions</h2><div class="table-wrap"><table id="recent-sessions"></table></div></div>
      <p class="disclaimer">NeuroSaathi supports daily routine, memory practice and caregiver coordination. It does not diagnose, treat or make any medical claim. Always follow your doctor's advice.</p>
    </main>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ai-engine.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/games-hub.js"></script>
<script>
  NS.auth.requireAuth("patient");
  NS.buildShell({ role: "patient", title: "Cognitive Games", subtitle: "Adaptive practice, one short session at a time" });
  if (window.PAGE_INIT) window.PAGE_INIT();
</script>
</body>
</html>
