<!DOCTYPE html>
<html lang="en" data-text-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress — NeuroSaathi</title>
<meta name="description" content="Cognitive engagement trends, per-activity scores and exportable reports.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content" id="main" tabindex="-1">
      <div class="filters"><select id="range" aria-label="Time range"><option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option><option value="90">Last 90 days</option></select>
        <select id="patient-select" aria-label="Patient"></select></div>
      <div class="grid grid-4" id="progress-stats" style="margin-bottom:18px"></div>
      <div class="grid grid-2" style="margin-bottom:18px">
        <div class="card"><h2>Accuracy trend</h2><div class="chart-box" id="chart-line"></div></div>
        <div class="card"><h2>Activity balance</h2><div id="game-bars"></div></div>
      </div>
      <div class="card" id="reports" tabindex="-1"><div class="card-head"><h2>Reports</h2>
        <div class="row" style="flex:0"><button class="btn btn-sm" id="export-json">⬇️ Export JSON</button>
        <button class="btn btn-sm btn-secondary" id="export-csv">⬇️ Export CSV</button>
        <button class="btn btn-sm btn-outline" id="print-report">🖨️ Print</button></div></div>
        <div class="insight" id="report-summary"></div></div>
      <p class="disclaimer">NeuroSaathi supports daily routine, memory practice and caregiver coordination. It does not diagnose, treat or make any medical claim. Always follow your doctor's advice.</p>
    </main>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ai-engine.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/progress.js"></script>
<script>
  NS.auth.requireAuth("patient");
  NS.buildShell({ role: "patient", title: "Progress & Reports", subtitle: "Engagement trends — not a medical assessment" });
  if (window.PAGE_INIT) window.PAGE_INIT();
</script>
</body>
</html>
