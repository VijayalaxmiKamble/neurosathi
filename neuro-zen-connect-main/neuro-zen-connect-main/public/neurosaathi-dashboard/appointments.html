<!DOCTYPE html>
<html lang="en" data-text-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appointments — NeuroSaathi</title>
<meta name="description" content="Upcoming and past doctor appointments with reminders.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content" id="main" tabindex="-1">
      <div class="filters"><button class="btn" id="add-appointment">➕ Add appointment</button>
        <select id="appt-filter" aria-label="Filter appointments"><option value="upcoming">Upcoming</option>
        <option value="past">Past</option><option value="all">All</option></select></div>
      <div class="grid grid-2" id="appointment-list"></div>
      <p class="disclaimer">NeuroSaathi supports daily routine, memory practice and caregiver coordination. It does not diagnose, treat or make any medical claim. Always follow your doctor's advice.</p>
    </main>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ai-engine.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/appointments.js"></script>
<script>
  NS.auth.requireAuth("patient");
  NS.buildShell({ role: "patient", title: "Appointments", subtitle: "Doctor visits and follow-ups" });
  if (window.PAGE_INIT) window.PAGE_INIT();
</script>
</body>
</html>
